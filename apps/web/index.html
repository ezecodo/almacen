<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OidoOps" />
    <link rel="apple-touch-icon" id="apple-touch-icon" href="/icon.svg" />
    <script>
      // Manifest, título e ícono por app instalable (/sala, /tpv, /pulso, /admin) — cada una necesita su
      // propio start_url/scope/ícono para que Android/iOS la reconozcan como una app separada.
      (function () {
        var path = window.location.pathname
        var app = path.startsWith('/pulso') ? 'pulso' : path.startsWith('/sala') ? 'sala' : path.startsWith('/tpv') ? 'tpv' : path.startsWith('/admin') ? 'admin' : null
        if (!app) return
        var titles = { pulso: 'OidoOps Pulso', sala: 'OidoOps Sala', tpv: 'OidoOps TPV', admin: 'OidoOps Admin' }
        var title = titles[app]
        document.title = title
        var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]')
        if (appleTitle) appleTitle.setAttribute('content', title)
        var appleIcon = document.getElementById('apple-touch-icon')
        if (appleIcon) appleIcon.setAttribute('href', '/icon-' + app + '.svg')
        var link = document.createElement('link')
        link.rel = 'manifest'
        link.href = '/manifest-' + app + '.json'
        document.head.appendChild(link)
        // Sala y TPV: sin zoom del navegador (pellizcar, doble toque, o el que hace iOS al tocar un
        // campo con letra chica). Con prisa se dispara sin querer y descoloca toda la pantalla.
        // El plano de reservas tiene su propio zoom y no depende de esto.
        if (app === 'sala' || app === 'tpv') {
          var vp = document.querySelector('meta[name="viewport"]')
          if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover')
          // iOS ignora user-scalable=no: el pellizco se corta aquí
          document.addEventListener('gesturestart', function (e) { e.preventDefault() }, { passive: false })
          document.documentElement.style.touchAction = 'manipulation' // sin zoom por doble toque
          document.documentElement.style.overscrollBehaviorX = 'none' // en el navegador, deslizar de lado no cambia de página
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700;1,800;1,900&family=Jost:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>OidoOps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
